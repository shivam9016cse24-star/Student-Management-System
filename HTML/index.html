<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Student Records Easily</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#addStudent">Add Student</a>
        <a href="#students">Students</a>
    </nav>

    <main>

        <section id="home" class="welcome">
            <h2>Welcome</h2>
            <p>
                This website helps you add, edit, delete,
                search and manage student records.
            </p>
        </section>

        <section id="addStudent" class="form-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter student name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="MCA">MCA</option>
                        <option value="MBA">MBA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter age">
                </div>

                <button type="submit" id="submitBtn">
                    Add Student
                </button>

            </form>

        </section>

        <section id="students" class="students-section">

            <h2>Student Records</h2>

            <div class="counter">
                Total Students:
                <span id="studentCount">0</span>
            </div>

            <input type="text" id="searchInput" class="search" placeholder="Search student by name...">

            <select id="filterCourse" class="filter">
                <option value="All">All Courses</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="MCA">MCA</option>
                <option value="MBA">MBA</option>
            </select>

            <div id="studentList" class="student-list"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 Student Management System</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
